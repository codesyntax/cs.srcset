[tox]

min_version = 4.11.0

envlist =
    py39-lint,
    py310-lint,
    py311-lint,
    py313-lint,
    black-check,
    py{39,310,311,312,313}-Plone{60},
    py{310,311,312,313}-Plone{61},
    py{310,311,312,313,314}-Plone{62},
#    docs,
#    coverage-report,

skip_missing_interpreters = True


[gh-actions]
python =
    3.9: py39, black-check
    3.10: py310, black-check
    3.11: py311, black-check
    3.12: py312, black-check
    3.13: py313, black-check
    3.14: py314, black-check



[gh-actions:env]
PLONE-VERSION =
    Plone60: Plone60
    Plone61: Plone61
    Plone62: Plone62


[testenv]
skip_install = true

extras =
    develop
    test

commands =
    {envbindir}/buildout -n -qq -c {toxinidir}/{env:version_file} buildout:directory={envdir} buildout:develop={toxinidir} install test robot
    coverage run {envbindir}/test -v1 --auto-color {posargs}
    # coverage run {envbindir}/test -v --all -t robot {posargs}

setenv =
    COVERAGE_FILE=.coverage.{envname}
    # version_file=test_plone60.cfg
    Plone60: version_file=test_plone60.cfg
    Plone61: version_file=test_plone61.cfg
    Plone62: version_file=test_plone62.cfg

deps =
    Plone60: -rrequirements_plone60.txt
#    Plone60: -cconstraints_plone60.txt
    Plone61: -rrequirements_plone61.txt
#    Plone61: -cconstraints_plone61.txt
    Plone62: -rrequirements_plone62.txt
    coverage


[testenv:coverage-report]
skip_install = true
usedevelop = True

deps =
    coverage

setenv =
    COVERAGE_FILE=.coverage

commands =
    coverage erase
    coverage combine
    coverage html
    coverage xml
    coverage report


[lint]
skip_install = true

deps =
    isort
    flake8
    # helper to generate HTML reports:
    # flake8-html>=0.4.3
    # Useful flake8 plugins that are Python and Plone specific:
    ; flake8-coding
    flake8-debugger
    flake8-deprecated
    flake8-print
    #flake8-pytest
    flake8-todo
    mccabe
    # Potential flake8 plugins that should be used:  # TBD
    #flake8-blind-except
    #flake8-commas
    #flake8-docstrings
    #flake8-mypy
    #flake8-pep3101
    #flake8-plone-hasattr
    #flake8-string-format
    #flake8_strict
    #flake8-quotes
    #flake8-polyfill

commands =
    mkdir -p {toxinidir}/reports/flake8
    flake8 --doctests {toxinidir}/src {toxinidir}/setup.py
    isort --check-only {toxinidir}/src {toxinidir}/setup.py
    # black --check --diff -v {toxinidir}/src {toxinidir}/setup.py

allowlist_externals =
    mkdir


[testenv:isort-apply]
skip_install = true

deps =
    isort

commands =
    isort {toxinidir}/src {toxinidir}/setup.py


[testenv:black-check]
skip_install = True
deps =
    black

commands =
    black --check --diff -v src setup.py


[testenv:black-enforce]
skip_install = True
deps =
    black

commands =
    black -v src setup.py


[testenv:py39-lint]
basepython = python3.9
skip_install = true
deps = {[lint]deps}
commands = {[lint]commands}
allowlist_externals = {[lint]allowlist_externals}

[testenv:py310-lint]
basepython = python3.10
skip_install = true
deps = {[lint]deps}
commands = {[lint]commands}
allowlist_externals = {[lint]allowlist_externals}

[testenv:py311-lint]
basepython = python3.11
skip_install = true
deps = {[lint]deps}
commands = {[lint]commands}
allowlist_externals = {[lint]allowlist_externals}

[testenv:py313-lint]
basepython = python3.13
skip_install = true
deps = {[lint]deps}
commands = {[lint]commands}
allowlist_externals = {[lint]allowlist_externals}

[testenv:docs]
skip_install = true

deps =
    Sphinx

commands =
    sphinx-build -b html -d _build/docs/doctrees docs _build/docs/html

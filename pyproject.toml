[build-system]
requires = ["setuptools>=68.2,<=75.8.0"]
build-backend = "setuptools.build_meta"

[tool.towncrier]
directory = "news/"
filename = "CHANGES.rst"
title_format = "{version} (unreleased)"
underlines = ["", "-"]
issue_format = "[#{issue}](https://github.com/codesyntax/cs.srcset/pull/{issue})"
type = [
    { directory = "breaking", name = "Breaking changes", showcontent = true },
    { directory = "feature", name = "New features", showcontent = true },
    { directory = "bugfix", name = "Bug fixes", showcontent = true },
]
